[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowdesk"
version = "0.1.0"
description = "Desktop 2D incompressible RANS k-epsilon flow laboratory"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "PySide6>=6.7,<7", "pyqtgraph>=0.13.7,<0.15"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
flowdesk = "flowdesk.gui:main"
flowdesk-benchmark = "flowdesk.benchmark:main"

[tool.setuptools.packages.find]
include = ["flowdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
