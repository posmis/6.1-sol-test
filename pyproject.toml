[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowdesk"
version = "0.4.0"
description = "Desktop 2D incompressible RANS k-epsilon flow laboratory"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2.6", "scipy>=1.15,<2", "PySide6>=6.7,<7", "pyqtgraph>=0.13.7,<0.15", "numba>=0.68,<0.69", "pyamg>=5.4,<6", "threadpoolctl>=3.6,<4", "ezdxf>=1.4,<2", "gmsh>=4.15,<5", "shapely>=2.1,<3", "meshio>=5.3,<6", "fipy==4.0.3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
flowdesk = "flowdesk.gui:main"
flowdesk-benchmark = "flowdesk.benchmark:main"
flowdesk-mesh = "flowdesk.mesh_gui:main"

[tool.setuptools.packages.find]
include = ["flowdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
